<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Verse</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="phone">

    <div class="header">
      <h1>经文</h1>
      <p>神有话要对你说</p>
    </div>

    <div class="verse-page-card">

      <div class="verse-title" id="verseTitle">
        当你...
      </div>

      <div class="big-verse" id="verseText">
        Loading...
      </div>

      <div class="big-reference" id="verseReference"></div>

      <div class="verse-image">
        <img id="verseImage" src="placeholder.jpg">
      </div>

    </div>

    <div class="bottom-buttons">

      <button id="backBtn" onclick="goHome()">
        Home
      </button>

    </div>

  </div>

  <script src="verses.js"></script>

  <script>

    const params = new URLSearchParams(window.location.search);

    let verseId = parseInt(params.get("id"));
    if (isNaN(verseId)) verseId = 0;

    const verse = verses[verseId];

    // =========================
    // LOAD DATA
    // =========================
    document.getElementById("verseTitle").innerText =
      verse.title || "当你...";

    document.getElementById("verseText").innerText =
      verse.text;

    document.getElementById("verseReference").innerText =
      verse.reference;

    document.getElementById("verseImage").src =
      verse.image || "placeholder.jpg";

    // =========================
    // 🔥 BACK BUTTON RULE
    // =========================
    let entryPage = localStorage.getItem("entryPage");

    // only show back button if user came from index
    if (entryPage !== "index") {
      document.getElementById("backBtn").style.display = "none";
    }

    function goHome() {
      window.location.href = "index.html";
    }

  </script>

</body>
</html>
