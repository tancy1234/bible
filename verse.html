<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Verse</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="phone">

    <div class="header">
      <h1>经文</h1>
      <p>神有话要对你说</p>
    </div>

    <!-- MAIN CARD -->
    <div class="verse-page-card">

      <!-- 1. TITLE -->
      <div class="verse-title" id="verseTitle" style="font-size:x-large;">
        当你...
      </div>

      <!-- 2. VERSE -->
      <div class="big-verse" id="verseText" style="font-size:medium;">
        再等一下...
      </div>

      <!-- 3. SOURCE -->
      <div class="big-reference" id="verseReference">
      </div>

      <!-- 4. IMAGE (BOTTOM) -->
      <div class="verse-image">
        <img id="verseImage" src="placeholder.jpg" alt="verse image">
      </div>


      <br>
      <div class="bottom-buttons">

        <button id="backBtn" onclick="goHome()">
          Home
        </button>

      </div>
    </div>

    
  <br><br><br>
  <div class="card">

      <h2>💌 分享恩典（24小时）</h2>


      <!-- Posts display area -->
      <div id="postList">

        <p>
          还没有分享，成为第一个祝福别人吧！
        </p>

      </div>


      <button onclick="openPostBox()">
        ＋ 分享
      </button>

    </div>
  </div>
  <!-- PUT POPUP HERE (outside phone) -->

  <div id="postPopup" class="popup">

    <div class="popup-box">

      <h2>💌 分享恩典</h2>


      <!-- Type Dropdown -->
      <label>
        分享类型
      </label>

      <select id="postType">

        <option value="testimony">
          🌿 见证
        </option>

        <option value="prayer">
          🙏 代祷
        </option>

        <option value="content">
          📖 经文
        </option>

      </select>
      <!-- Message Area -->

      <label>
        分享内容
      </label>
      <textarea
        id="postMessage"
        maxlength="200"
        placeholder="写下神在你生命中的作为..."
      ></textarea>

      <div class="word-count">
        最多 200 字
      </div>

      <div class="popup-buttons">
        <button onclick="submitPost()">
          发布
        </button>
        <button onclick="closePostBox()">
          取消
        </button>
      </div>

    </div>

  </div>

  <script src="verses.js"></script>

  <script type="module">
    
    import {
        db,
        auth,
        loginUser
    }
    from "./firebase.js";


    import {

        collection,
        addDoc,
        getDocs,
        query,
        orderBy

    }
    from "https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js";
    // Login anonymous user
    let currentUser;
    currentUser = await loginUser();


    console.log(
        "User ID:",
        currentUser.uid
    );

    try {

        const user = await loginUser();


        console.log(
            "User ID:",
            user.uid
        );

    }
    catch(error){

        console.log(
            "Firebase Login Error:",
            error
        );
    }

    loadPosts();

    
    const params = new URLSearchParams(window.location.search);

    let verseId = parseInt(params.get("id"));
    let from = params.get("from"); // 👈 THIS IS THE KEY

    if (isNaN(verseId)) {
      verseId = 0;
    }

    const verse = verses[verseId];

    // LOAD CONTENT
    document.getElementById("verseTitle").innerText =
      verse.title || "当你...";

    document.getElementById("verseText").innerText =
      verse.text;

    document.getElementById("verseReference").innerText =
      verse.reference;

    document.getElementById("verseImage").src =
      verse.image || "placeholder.jpg";


    // ======================
    // 🔥 BACK BUTTON LOGIC
    // ======================

    if (from === "index" || from === "show") {
        document.getElementById("backBtn").style.display = "block";
    } else {
        document.getElementById("backBtn").style.display = "none";
    }

    
    const home = params.get("home");

    window.goHome = function(){

        if (from === "show") {

            window.location.href = "show.html";

        } else {

            window.location.href = "index.html";

        }

    }

    window.openPostBox = function(){

        document.getElementById("postPopup")
        .style.display="block";

    }



    window.closePostBox = function(){

        document.getElementById("postPopup")
        .style.display="none";

    }



    window.submitPost = async function(){


        let message =
        document.getElementById("postMessage")
        .value
        .trim();


        let type =
        document.getElementById("postType")
        .value;



        if(message === ""){
            alert("请输入内容");
            return;
        }

        try{
            await addDoc(
                collection(db,"posts"),

                {

                    message: message,

                    type: type,

                    createdAt: Date.now(),

                    ownerId: currentUser.uid

                }
            );
            alert("发布成功 ❤️");
            document.getElementById("postMessage")
            .value="";
            closePostBox();

            loadPosts();  
        }
        catch(error){
            console.log(
                "Firebase Error:",
                error.code
            );
            console.log(
                error.message
            );
            alert(
                error.code + "\n\n" + error.message
            );
        }
    }


    async function loadPosts(){


        const postList =
        document.getElementById("postList");


        postList.innerHTML = "";


        const q = query(
            collection(db,"posts"),
            orderBy("createdAt","desc")
        );


        const snapshot =
        await getDocs(q);



        if(snapshot.empty){

            postList.innerHTML =
            `
            <p>
            还没有分享，成为第一个祝福别人吧！
            </p>
            `;

            return;

        }



        snapshot.forEach((doc)=>{


            const data = doc.data();



            let icon = "🌿";
            let title = "见证";


            if(data.type === "prayer"){

                icon = "🙏";
                title = "代祷";

            }


            else if(data.type === "content"){

                icon = "📖";
                title = "经文";

            }



            postList.innerHTML +=
            `

            <div class="post-item">


                <h3>
                ${icon} ${title}
                </h3>
                <br>

                <p>
                ${data.message}
                </p>

                <br>
                <small>
                ${new Date(data.createdAt)
                .toLocaleString()}
                </small>


            </div>


            `;


        });


    }
  </script>

</body>
</html>
