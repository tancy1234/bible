<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Blessing NFC</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="phone">

    <div class="header">
      <h1>来自神的祝福</h1>
      
    </div>

    <!-- Daily Verse -->
    <div class="card">
      <h2>每日经文</h2>

      <p id="dailyVerseText">
        稍等...
      </p>

      <span id="dailyVerseRef"></span>

      <button onclick="openDailyVerse()">
        今天神有话要对你说
      </button>
    </div>

    <!-- Random Verse -->
    <div class="card">
      <h2>领受祝福</h2>

      <p>
        点击下方获取祝福经文
      </p>

      <button onclick="randomVerse()">
        随机经文
      </button>
    </div>

    <!-- Verse List -->
    <div class="card">
      <h2>我的收藏</h2>

      <div class="verse-list" id="verseList"></div>
    </div>

  </div>

  <script src="verses.js"></script>

  <script>

    // DAILY VERSE
    const today = new Date().getDate();
    const dailyIndex = today % verses.length;
    const dailyVerse = verses[dailyIndex];

    document.getElementById("dailyVerseText").innerText =
      dailyVerse.text;

    document.getElementById("dailyVerseRef").innerText =
      dailyVerse.reference;

    function openDailyVerse(){
      window.location.href = `verse.html?id=${dailyIndex}&from=index`;
    }

    // RANDOM VERSE
    function randomVerse(){

      const randomIndex =
        Math.floor(Math.random() * verses.length);

      window.location.href = `verse.html?id=${randomIndex}&from=index`;
    }

    // VERSE COLLECTION
    const verseList =
      document.getElementById("verseList");

    verses.forEach((verse, index) => {

      const button =
        document.createElement("button");

      button.innerText =
        verse.title;

      
      button.onclick = () => {
        window.location.href = `verse.html?id=${index}&from=index`;
      };
      verseList.appendChild(button);
    });

  </script>

</body>
</html>
