<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Bible NFC Index</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="phone">

    <div class="header">
      <h1>经文</h1>
      <p>神有话要对你说</p>
    </div>

    <!-- DAILY CARD -->
    <div class="card">
      <h2>Daily Verse</h2>
      <p id="dailyText">Loading...</p>
      <button onclick="openDaily()">Read</button>
    </div>

    <!-- VERSE LIST -->
    <div class="card">
      <h2>All Verses</h2>
      <div id="verseList"></div>
    </div>

  </div>

  <script src="verses.js"></script>

  <script>

    // =========================
    // 🔥 MARK ENTRY AS INDEX
    // =========================
    localStorage.setItem("entryPage", "index");

    // =========================
    // DAILY VERSE
    // =========================
    const today = new Date().getDate();
    const dailyIndex = today % verses.length;

    document.getElementById("dailyText").innerText =
      verses[dailyIndex].title;

    function openDaily() {
      window.location.href = `verse.html?id=${dailyIndex}`;
    }

    // =========================
    // BUILD VERSE LIST
    // =========================
    const list = document.getElementById("verseList");

    verses.forEach((v, i) => {

      const btn = document.createElement("button");

      btn.innerText = v.title || v.reference;

      btn.style.display = "block";
      btn.style.margin = "8px 0";

      btn.onclick = () => {
        window.location.href = `verse.html?id=${i}`;
      };

      list.appendChild(btn);
    });

  </script>

</body>
</html>
